name: Hardware report
description: Report how Omarchy runs on a specific machine (prefilled by omarchylinux.org/hardware/submit/)
title: "[hw-report] "
labels: [hardware-report]
body:
  - type: markdown
    attributes:
      value: "Thanks. Only share the redacted `omarchy debug` excerpt; never paste logs with hostnames or IPs."
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Paste the report generated by the submit page.
    validations:
      required: true
