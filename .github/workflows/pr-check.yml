name: PR check

on: [pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate content frontmatter
        run: node scripts/validate-content.mjs

      - name: Build
        run: npx astro build

      - name: Check internal links
        run: node scripts/linkcheck.mjs
